<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Grid Layout</title>
 
    <link rel="stylesheet" href="css/style.css">
</head>
 
<body>
 
    <header>
        <h1>Nossa Nova Viagem</h1>
    </header>
 
    <main>
 
        <section class="destaque">
 
            <img class="imagem-principal"
                src="images/banner/01.jpg"
                alt="Paisagem de uma cidade à beira do mar">
 
            <div class="texto">
 
                <p>
                 Um dia vamos Ver tudo isso
                </p>
 
                <a href="#">Saiba mais</a>
 
            </div>
 
 
            <div class="imagens-menores">
 
                <img src="images/sea/01.jpg"
                    alt="Praia e casas próximas ao mar">
 
                <img src="images/sea/02.jpg"
                    alt="Paisagem com casas brancas">
 
                <img src="images/sea/03.jpg"
                    alt="Casa próxima ao mar">
 
            </div>
 
        </section>
 
 
        <section class="galeria">
 
            <img class="imagem-1"
                src="images/sea/01.jpg"
                alt="Praia">
 
            <img class="imagem-2"
                src="images/sea/02.jpg"
                alt="Mar">
 
            <img class="imagem-3"
                src="images/sea/01.jpg"
                alt="Praia">
 
            <img class="imagem-4"
                src="images/sea/02.jpg"
                alt="Mar">
 
            <img class="imagem-5"
                src="images/sea/01.jpg"
                alt="Praia">
 
            <img class="imagem-6"
                src="images/sea/03.jpg"
                alt="Praia">
 
            <img class="imagem-7"
                src="images/sea/01.jpg"
                alt="Paisagem do litoral">
 
            <img class="imagem-8"
                src="images/sea/03.jpg"
                alt="Praia">
 
            <img class="imagem-9"
                src="images/sea/01.jpg"
                alt="Praia">
 
        </section>
 
    </main>
 
 
    <footer>
 
        <p>
            André RM568928
            Richard RM569344
        </p>
 
    </footer>
 
</body>
 
</html>
